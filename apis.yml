- aid: starwood-hotels-and-resorts:property-data-api
  name: Property Data API
  description: >-
    The Starwood Property Data API provided detailed information about individual hotel properties including
    room types, amenities, dining options, meeting and event spaces, photos, geo-coordinates, and contact
    information. Partners used this API to populate travel booking sites and corporate travel management
    systems with accurate Starwood property content.
  humanURL: https://www.starwoodhotels.com/
