name: Starwood Hotels and Resorts
description: >-
  Starwood Hotels & Resorts Worldwide was a global hotel and leisure company headquartered in Stamford, Connecticut.
  Prior to its acquisition by Marriott International in September 2016, Starwood operated and franchised hotels,
  resorts, and residences under iconic brands including Sheraton, Westin, W Hotels, St. Regis, Le Méridien, Four Points,
  Tribute Portfolio, Design Hotels, Element, and Aloft. The company also operated the Starwood Preferred Guest (SPG)
  loyalty program, which was later merged into Marriott Bonvoy. At the time of acquisition, Starwood managed over 1,300
  properties in approximately 100 countries. Starwood exposed APIs for hotel search, property data, and loyalty program
  integration that were consumed by travel platforms and partners.
apis:
- aid: starwood-hotels-and-resorts:spg-loyalty-api
  name: SPG Loyalty API
  description: >-
    The Starwood Preferred Guest (SPG) Loyalty API provided programmatic access to the SPG loyalty program,
    enabling partners to query member point balances, redeem Starpoints, look up member status and tier
    information, and book award nights. The program offered Preferred, Gold, and Platinum status tiers
    with corresponding benefits. Following the Marriott acquisition, SPG was eventually merged into the
    Marriott Bonvoy loyalty program in 2019.
  humanURL: https://www.starwoodhotels.com/preferredguest/
  baseURL: https://www.starwoodhotels.com/api/spg
  tags:
